<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta name="theme-color" content="#f7f6f2">
    <title>{% if page.title and page.title != '首页' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <script>
        try {
            const savedTheme = localStorage.getItem('forj-theme');
            if (savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
            <span class="brand-mark">F</span>
            <span>ForJ.</span>
        </a>
        <div class="header-actions">
            <a class="nav-link" href="{{ '/' | relative_url }}#articles">文章</a>
            <a class="nav-link" href="https://github.com/ForJ121" rel="me">GitHub</a>
            <button class="theme-toggle" type="button" aria-label="切换深色模式">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
            </button>
        </div>
    </header>

    <main class="page-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <a class="footer-home" href="{{ '/' | relative_url }}">ForJ.</a>
        <p>写作、思考与生活。</p>
        <p>© <span id="current-year">{{ site.time | date: '%Y' }}</span></p>
    </footer>
    <script src="{{ '/script.js' | relative_url }}"></script>
</body>
</html>
